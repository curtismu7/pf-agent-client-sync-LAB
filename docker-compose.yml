services:
  pf-agent-client-sync:
    build: .
    image: pf-agent-client-sync-lab:local
    container_name: pf-agent-client-sync-lab
    ports:
      - "127.0.0.1:7822:7822"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=7822
      - BIND_HOST=0.0.0.0
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
